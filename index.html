<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Journey of a Prompt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Crect x='12' y='20' width='40' height='26' rx='5' fill='%23fff'/%3E%3Cpath d='M13 22l19 14 19-14' fill='none' stroke='%232f6fed' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{--amber:#f4a62a;--blue:#3b7bff;--green:#4ade80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05060c;color:#fff;
  font-family:Aptos,"Segoe UI",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}
.shade{position:fixed;left:0;right:0;top:0;height:46%;pointer-events:none;background:linear-gradient(rgba(3,5,12,.9),rgba(3,5,12,.55) 48%,transparent)}
.shade-b{position:fixed;left:0;right:0;bottom:0;height:20%;pointer-events:none;background:linear-gradient(transparent,rgba(3,5,12,.72))}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .32s ease}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#05060c;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:#aab6d6;text-align:center;padding:20px;transition:opacity .6s ease}

/* HUD: top strip */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:12px 16px;pointer-events:none}
.top > *{pointer-events:auto}
.brand{font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:.7rem;opacity:.9;white-space:nowrap}
.legend{display:grid;gap:7px;min-width:0}
.chapter{font-size:.7rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);text-shadow:0 2px 10px rgba(0,0,0,.8)}
.dots{display:flex;gap:6px;width:min(340px,42vw)}
.dot{position:relative;flex:1;height:5px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.25);cursor:pointer;transition:background .3s ease}
.dot::before{content:"";position:absolute;inset:-12px 0}
.dot.visited{background:rgba(255,255,255,.75)}
.dot.active{background:var(--amber)}
.spacer{flex:1}
.timer{font-family:"SFMono-Regular",ui-monospace,Consolas,monospace;font-size:.86rem;font-variant-numeric:tabular-nums;opacity:.95;white-space:nowrap}
.timer small{font-family:inherit;opacity:.6;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.mini{height:30px;min-width:34px;padding:0 9px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(8,12,26,.45);
  font-size:.72rem;font-weight:800;letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(6px)}
.mini.active{background:#fff;color:#0b1020;border-color:#fff}

/* HUD: text top center, chapters bottom left, buttons bottom right */
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  padding:18px 22px calc(18px + env(safe-area-inset-bottom));pointer-events:none}
.bottom > *{pointer-events:auto}
.caption{position:fixed;top:48px;left:50%;transform:translateX(-50%);width:min(780px,calc(100vw - 36px));text-align:center;
  text-shadow:0 2px 14px rgba(0,0,0,.85);pointer-events:none}
.caption .pill{pointer-events:auto}
.kicker{font-size:.7rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--amber)}
.caption h2{margin:4px 0 8px;font-size:clamp(1.55rem,3.2vw,2.6rem);line-height:1.08;font-weight:900;text-wrap:balance}
.say{margin:0;font-size:clamp(1.08rem,1.7vw,1.4rem);line-height:1.45;color:#f0f3fc}
.stepno{font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#cfd6ee;margin-top:2px}
.hint{margin:10px 0 0;font-size:1rem;font-weight:800;color:var(--amber);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.beats{display:flex;justify-content:center;gap:5px;margin:7px 0 2px}
.beats i{width:34px;height:5px;border-radius:4px;background:rgba(255,255,255,.28)}
.beats i.on{background:var(--amber)}
h2.beat{animation:rise .4s ease both}
.like{margin:8px 0 0;font-size:1.05rem;color:#ffd58a;font-weight:700}
.note{margin:8px 0 0;font-size:1.05rem;color:#8ef0b4;font-weight:700;animation:rise .35s ease both}
.note strong{color:#fff}
@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
.pills{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.pill{padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(8,12,26,.5);
  font-size:.74rem;font-weight:800;cursor:pointer;text-shadow:none}
.pill.active{background:#8b5cf6;border-color:#8b5cf6}
.actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.back-btn{width:50px;height:60px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(8,12,26,.5);font-size:1.3rem;cursor:pointer;backdrop-filter:blur(6px)}
.main-btn{min-height:60px;padding:0 30px;border:0;border-radius:14px;background:#fff;color:#0b1020;font-weight:900;font-size:1.15rem;cursor:pointer;
  box-shadow:0 12px 34px rgba(0,0,0,.45);transition:transform .2s ease,opacity .2s ease;white-space:nowrap}
.main-btn{position:relative;overflow:hidden}
.main-btn::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:calc(var(--p,0)*100%);background:#2f6fed}
.auto-btn{height:60px;padding:0 15px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(8,12,26,.5);font-weight:800;font-size:.98rem;cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap}
.auto-btn.on{background:var(--amber);color:#2a1c02;border-color:var(--amber)}
.main-btn.act{background:var(--amber);color:#2a1c02;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(244,166,42,.22),0 12px 34px rgba(0,0,0,.45)}}
.main-btn:hover{transform:translateY(-2px)}
.main-btn:disabled,.back-btn:disabled{opacity:.35;cursor:default;transform:none;animation:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media(max-width:900px){
  .brand,.timer small{display:none}
  .top{gap:8px;padding:10px 12px}
  .caption{top:46px}
  .bottom{flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .dots{width:100%}
  .main-btn{flex:1;white-space:normal}
  .like{font-size:.88rem}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="-1"></canvas>
<div class="vignette"></div>
<div class="shade"></div>
<div class="shade-b"></div>

<div class="top">
  <div class="timer"><span id="timerValue">0.000 s</span><small id="timerLabel"></small></div>
  <button class="mini" type="button" data-speed="0.6">🐢</button>
  <button class="mini" type="button" data-speed="1">🐇</button>
  <span style="width:6px"></span>
  <button class="mini" type="button" data-lang="en">EN</button>
  <button class="mini" type="button" data-lang="es">ES</button>
  <button class="mini" type="button" id="fsBtn" aria-label="Fullscreen">⛶</button>
</div>

<div class="caption" id="caption" aria-live="polite"></div>

<div class="bottom">
  <div class="legend">
    <div class="brand" id="brand"></div>
    <div class="chapter" id="chapter"></div>
    <nav class="dots" id="dots"></nav>
  </div>
  <div class="actions">
    <button class="auto-btn" id="autoBtn" type="button"></button>
    <button class="back-btn" id="backBtn" type="button">‹</button>
    <button class="main-btn" id="mainBtn" type="button"></button>
  </div>
</div>

<div id="fade"></div>
<div id="loading">Loading the 3D world…<br>(needs an internet connection the first time)</div>

  const cinematic=!cut&&i===current+1;
  clearTasks();
  done=false;replayed=false;subNote="";sub=0;busy=true;beat=-1;boost=1.5;
  const prev=current;current=i;
  setTimer(T[i]);renderHUD();
  if(!cinematic){
    fade(()=>{
      resetStop(i);
      if(i===MODEL){lockGoal=lockOn=0;setSub(0);return;}
      placeAt(i);busy=false;renderHUD();
    });
    return;
  }
  resetStop(i);
  if(i===MODEL){ /* dive into a chip */
    travel({env:[[GX+.02,1.3,3.5]],cam:[[340.15,1.36,2.9],[GX-.12,1.3,3.46]],look:[GX+.1,1.27,3.6],dur:1.7,follow:false});
    tween(.6,1,p=>{heroVis=1-p;});
    at(1.45,()=>flash(()=>setSub(0)));
    return;
  }
  if(i===HOME){ /* back through the chip, then the whole road in reverse */
    flash(()=>{
      placeAt(-1,GPU_POSE);lockGoal=lockOn=1;
      ride(1,0,7);
      travel({delay:7,cam:[POSE[HOME].cam],look:POSE[HOME].look,dur:1.3,follow:false});
      at(8.3,()=>{busy=false;renderHUD();});
    });
    return;
  }
  const t=TRAVEL[i],P=POSE[i];
  travel({env:[...t.env,P.hero],cam:[...t.cam,P.cam],look:P.look,dur:t.dur});
  at(t.dur,()=>{busy=false;renderHUD();});
}
function runAction(){
  busy=true;stepping=true;beat=0;boost=1;
  beatTimes(current).forEach((t,k)=>{if(k) gate(t,()=>{beat=k;});});
  renderHUD();
  const dur=actions[current]();
  at(dur,()=>{done=true;busy=false;stepping=false;renderHUD();});
}
function mainAction(){
  if(waiting){release();return;}
  if(busy) return;
  if(current===MODEL){sub<4?setSub(sub+1):go(HOME);return;}
  if(!done){runAction();return;}
  if(current===HOME){replayed?go(0,true):replay();return;}
  go(current+1);
}
let liveTimer=null;
function back(){
  if(current===MODEL){sub>0?setSub(sub-1):go(3,true);return;}
  go(beat>=0?current:current-1,true);
}
function replay(){
  clearTasks();
  busy=true;realSpeed=true;renderHUD();
  phoneState.words=[];phoneTex.redraw();
  liveTimer=clock;
  const lin=t=>t*t*(3-2*t);
  ride(0,1,.45,lin);
  at(.6,()=>ride(1,0,.4,lin));
  at(1,()=>{liveTimer=null;showTimer(1000);streamWords(.07,false);});
  travel({delay:1,cam:[POSE[HOME].cam],look:POSE[HOME].look,dur:.6,follow:false});
  at(1+ui.answer.length*.07+.7,()=>{busy=false;realSpeed=false;replayed=true;renderHUD();});
}

/* =====================================================================
   HUD
   ===================================================================== */
let timerShown=0;
function showTimer(ms){timerShown=ms;$("timerValue").textContent=(ms/1000).toFixed(3)+" s";}
function setTimer(target){const from=timerShown;tween(0,.6,p=>showTimer(from+(target-from)*p));}
let lastBeatKey="";
/* auto-play: moves on by itself once there has been time to read what is new on screen */
let auto=false,capKey="",capSeen=new Set(),capT0=0,capDur=4,enT0=0,wasEn=false,lastP=-1;
function renderHUD(){
  const n=ui.stops.length,stop=ui.stops[current],isModel=current===MODEL;
  const beatKey=current+":"+beat,fresh=beatKey!==lastBeatKey;lastBeatKey=beatKey;
  const b=!isModel&&beat>=0?stop.beats[beat]:null;
  const s=isModel?ui.subs[sub]:(b?{title:b[0],say:b[1]}:stop);
  const nextName=i=>`${ui.nextStep}: ${ui.stops[i].name} →`;
  let labelTxt,act=false;
  const g=stepping&&gates[0],gl=g?(g.label||ui.cont):"";
  if(g){labelTxt=gl+" ▸";act=waiting;}
  else if(isModel) labelTxt=sub<4?`${ui.nextStep}: ${ui.subs[sub+1].name} →`:nextName(HOME);
  else if(!done&&!stepping){labelTxt=stop.action;act=true;}
  else if(current===HOME) labelTxt=replayed?ui.restart:ui.replay;
  else labelTxt=nextName(current+1);
  const note=isModel?subNote:(done?(current===HOME&&replayed?ui.replayDone:stop.after):"");
  $("caption").innerHTML=`
    ${isModel?`<div class="pills">${ui.subs.map((x,i)=>`<button class="pill ${i===sub?"active":""}" type="button" data-sub="${i}">${i+1}. ${x.name}</button>`).join("")}</div>`:""}
    ${b&&stop.beats.length>1?`<div class="stepno">${ui.stepOf(beat+1,stop.beats.length)}</div><div class="beats">${stop.beats.map((x,i)=>`<i class="${i<=beat?"on":""}"></i>`).join("")}</div>`:""}
    <h2 ${b&&fresh?'class="beat"':""}>${s.title}</h2>
    <p class="say">${s.say}</p>
    ${b||(isModel&&note)?"":`<p class="like">💡 ${s.like}</p>`}
    ${note?`<p class="note">${isModel?"":"✓ "}${note}</p>`:""}
    ${waiting&&!auto?`<p class="hint">${ui.ready(gl)}</p>`:""}`;
  $("chapter").textContent=ui.kicker(current+1,n,stop.name);
  const mb=$("mainBtn");mb.textContent=labelTxt;mb.disabled=busy&&!waiting;mb.classList.toggle("act",act);
  const ck=current+":"+sub+":"+beat,fresh2=ck!==capKey,wps=rate<1?2.3:3;
  if(fresh2){capKey=ck;capSeen=new Set();}
  let nw=0;
  $("caption").querySelectorAll("h2,.say,.like,.note").forEach(e=>{const tx=e.textContent.trim();if(tx&&!capSeen.has(tx)){capSeen.add(tx);nw+=tx.split(/\s+/).length;}});
  if(nw){const left=fresh2?1.5:Math.max(0,capT0+capDur-amb);capT0=amb;capDur=Math.max(fresh2?3:0,left+nw/wps);}
  if(!mb.disabled&&!wasEn) enT0=amb;
  wasEn=!mb.disabled;
  const ab=$("autoBtn");ab.textContent=(auto?"⏸ ":"▶ ")+ui.auto;ab.classList.toggle("on",auto);ab.title=auto?ui.autoOn:ui.autoOff;ab.setAttribute("aria-label",ab.title);ab.setAttribute("aria-pressed",auto);
  $("backBtn").disabled=current===0&&beat<0;$("backBtn").setAttribute("aria-label",ui.back);
  document.querySelectorAll(".dot").forEach((d,k)=>{d.classList.toggle("active",k===current);d.classList.toggle("visited",k<current);});
  stageFit();
}
function applyLanguage(){
  ui=appCopy[lang];
  document.documentElement.lang=ui.htmlLang;document.title=ui.documentTitle;
  $("brand").textContent=ui.brand;$("timerLabel").textContent=ui.timerLabel;
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  $("dots").innerHTML=ui.stops.map((s,i)=>`<button class="dot" type="button" data-stop="${i}" title="${i+1}. ${s.name}" aria-label="${ui.kicker(i+1,ui.stops.length,s.name)}"></button>`).join("");
  paintSpeed();
  labels.forEach(l=>l.sp.userData.set(ui.labels[l.key]));
  phoneTex.redraw();dnsTex.redraw();secTex.redraw();signTex.redraw();
  rebuildWords();
}
$("mainBtn").addEventListener("click",mainAction);
$("backBtn").addEventListener("click",back);
$("autoBtn").addEventListener("click",()=>{
  auto=!auto;enT0=amb;
  if(auto&&current===HOME&&done&&replayed){go(0,true);return;}
  renderHUD();
});
const speedBtns=[...document.querySelectorAll("[data-speed]")];
const paintSpeed=()=>speedBtns.forEach(b=>{b.classList.toggle("active",+b.dataset.speed===rate);const l=+b.dataset.speed<1?ui.slow:ui.fast;b.title=l;b.setAttribute("aria-label",l);});
speedBtns.forEach(b=>b.addEventListener("click",()=>{rate=+b.dataset.speed;paintSpeed();}));
$("dots").addEventListener("click",e=>{const b=e.target.closest("[data-stop]");if(b) go(+b.dataset.stop,true);});
$("caption").addEventListener("click",e=>{const b=e.target.closest("[data-sub]");if(b&&current===MODEL) setSub(+b.dataset.sub);});
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.lang===lang) return;
  lang=b.dataset.lang;applyLanguage();
  if(current===MODEL) setSub(sub); else go(current,true);
}));
$("fsBtn").addEventListener("click",()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();});
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("button")) return;
  if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){e.preventDefault();mainAction();}
  if(e.key==="ArrowLeft") back();
});

/* pointer: look around a little, tap things in the world */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),mouse={x:0,y:0,sx:0,sy:0};
function pick(e){
  ndc.set(e.clientX/window.innerWidth*2-1,-(e.clientY/window.innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(tappables,false)[0];
  return hit&&hit.object.userData.can()?hit.object:null;
}
let downAt=null;
canvas.addEventListener("pointermove",e=>{
  mouse.x=e.clientX/window.innerWidth*2-1;mouse.y=e.clientY/window.innerHeight*2-1;
  if(e.pointerType==="mouse") canvas.style.cursor=pick(e)?"pointer":"default";
});
canvas.addEventListener("pointerdown",e=>{downAt=[e.clientX,e.clientY];});
canvas.addEventListener("pointerup",e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>8) return;
  const o=pick(e);if(o) o.userData.tap();
});

/* =====================================================================
   FRAME LOOP
   ===================================================================== */
const rclock=new THREE.Clock(),tmpV=V(0,0,0),blinkers=[];
scene.traverse(o=>{if(o.userData.blink!==undefined) blinkers.push(o);});
let towerRing=0,first=true;
function frame(){
  requestAnimationFrame(frame);
  step(Math.min(.1,rclock.getDelta()),true);
}
function step(dt,draw){
  amb+=dt;
  if(!waiting){
    let nc=clock+dt*(realSpeed?1:Math.min(1,rate*boost));
    if(gates.length&&nc>=gates[0].t){nc=gates[0].t;waiting=true;renderHUD();}
    clock=nc;
  }
  runTasks();
  {
    const mb=$("mainBtn");let pr=0;
    if(auto&&!mb.disabled){
      if(current===HOME&&done&&replayed){auto=false;renderHUD();}
      else{pr=Math.min(1,(amb-capT0)/capDur,(amb-enT0)/1.5);if(pr>=1){pr=0;mainAction();}}
    }
    if(pr!==lastP){lastP=pr;mb.style.setProperty("--p",pr.toFixed(3));}
  }
  if(liveTimer!==null) showTimer((clock-liveTimer)*1000);

  /* hero */
  const target=heroScaleOverride??heroScaleAt(hero.position);
  heroS+=(target-heroS)*(1-Math.exp(-dt*6));
  hero.scale.setScalar(Math.max(.0001,heroS*heroVis));
  heroIn.position.y=Math.sin(amb*2.2)*.012;heroIn.rotation.z=Math.sin(amb*1.3)*.06;
  lockOn+=(lockGoal-lockOn)*(1-Math.exp(-dt*7));
  lockG.scale.setScalar(Math.max(.0001,lockOn));lockG.rotation.z=(1-lockOn)*1.4;
  heroLight.intensity=.22*heroS*heroS*heroVis;heroLight.distance=7*heroS;
  for(let k=TRAIL-1;k>0;k--){trailPos[k*3]=trailPos[k*3-3];trailPos[k*3+1]=trailPos[k*3-2];trailPos[k*3+2]=trailPos[k*3-1];}
  hero.position.toArray(trailPos,0);trailGeo.attributes.position.needsUpdate=true;
  trail.material.size=.055*heroS;trail.material.opacity=.5*heroVis;

  /* camera */
  lookEff.copy(lookGoal);
  if(camera.aspect<1&&heroVis>.5&&current!==MODEL) lookEff.lerp(hero.position,.45);
  lookCur.lerp(lookEff,1-Math.exp(-dt*5));
  mouse.sx+=(mouse.x-mouse.sx)*(1-Math.exp(-dt*4));mouse.sy+=(mouse.y-mouse.sy)*(1-Math.exp(-dt*4));
  camera.position.copy(camBase);camera.lookAt(lookCur);
  const a=Math.min(.6,Math.max(.012,camBase.distanceTo(lookCur)*.035));
  camera.translateX(mouse.sx*a);camera.translateY(-mouse.sy*a*.6);camera.lookAt(lookCur);
  hero.quaternion.copy(camera.quaternion);
  packets.forEach(p=>p.quaternion.copy(camera.quaternion));

  waves.forEach(r=>{
    if(!r.m.visible) return;
    r.life+=dt/r.dur;
    if(r.life>=1){r.m.visible=false;return;}
    r.m.position.copy(hero.position);r.m.quaternion.copy(camera.quaternion);r.m.scale.setScalar(.2+(r.max-.2)*r.life);r.m.material.opacity=(1-r.life)*.9;
  });
  waveCore.visible=waveOn>.01;waveCore.position.copy(hero.position);waveCore.material.opacity=waveOn*.75;waveCore.scale.setScalar(heroS*.3);

  /* center stage */
  stageOn+=(stageGoal-stageOn)*(1-Math.exp(-dt*5));
  veil.visible=stageOn>.01;veil.material.opacity=.97*stageOn;
  stagePlane.visible=stageOn>.01&&stageScale>.01;stagePlane.material.opacity=Math.min(1,stageOn*1.4);
  if(stage.live&&stageOn>.02){stageT+=dt;if(stageT>.045){stageT=0;stageTex.redraw();}}
  const ssc=stageScale*(.55+.45*stageOn);
  stagePlane.scale.set(stageBox.w*ssc,stageBox.h*ssc,1);
  stagePlane.position.y+=(stageBox.y*stageScale-stagePlane.position.y)*(1-Math.exp(-dt*8));

  /* atmosphere by zone */
  const zn=zoneOf(camera.position),Z=ZONES[zn],k=1-Math.exp(-dt*(zn==="sea"?9:4));
  zoneCur.fog.lerp(zoneCol.set(Z.fog),k);
  ["den","sun","hemi","fill","exp"].forEach(key=>{zoneCur[key]+=(Z[key]-zoneCur[key])*k;});
  const openAir=zn==="out"||zn==="room"||zn==="sea";
  zoneCur.env+=((skyEnv||!openAir?Z.env:.25)-zoneCur.env)*k;
  scene.environment=openAir&&skyEnv?skyEnv:roomEnv;scene.environmentIntensity=zoneCur.env;
  if(ocean){ocean.material.uniforms.time.value=amb*.5;ocean.visible=camera.position.y>-.15;underSea.visible=!ocean.visible;}
  scene.fog.color.copy(zoneCur.fog);bgColor.copy(zoneCur.fog);scene.fog.density=zoneCur.den;
  sun.intensity=zoneCur.sun;hemi.intensity=zoneCur.hemi;fill.intensity=zoneCur.fill;renderer.toneMappingExposure=zoneCur.exp;
  skyGroup.visible=zn==="out"||zn==="room";skyGroup.position.copy(camera.position);
  setShadowExt(zn==="room"?6:45);
  sun.target.position.copy(lookCur);sun.position.copy(lookCur).addScaledVector(SUN_DIR,140);
  fill.position.copy(lookCur);fill.position.y+=zn==="model"?5:2.6;fill.position.z+=zn==="model"?7:0;

  /* ambient life */
  curves.forEach((c,ci)=>{for(let j=0;j<7;j++){c.getPointAt((amb*(.05+ci*.004)+j/7+ci*.13)%1,tmpV);dummy.position.copy(tmpV);dummy.scale.setScalar(1);dummy.rotation.set(0,0,0);dummy.updateMatrix();pulses.setMatrixAt(ci*7+j,dummy.matrix);}});
  pulses.instanceMatrix.needsUpdate=true;
  beacon.material.emissiveIntensity=Math.sin(amb*4)>0?4.5:.5;
  blinkers.forEach(b=>{b.material.emissiveIntensity=Math.sin(amb*6+b.userData.blink*1.7)>0?3:.4;});
  towerRing-=dt;
  if(towerRing<0&&camera.position.x<120){towerRing=1.1;emitRing(V(42,29,-8),UP,16,2.6);}
  rings.forEach(r=>{
    if(!r.m.visible) return;
    r.life+=dt/r.dur;
    if(r.life>=1){r.m.visible=false;return;}
    r.m.scale.setScalar(.3+(r.max-.3)*r.life);r.m.material.opacity=(1-r.life)*.75;
  });

  if(!draw) return;
  composer.render();
  if(first){first=false;const l=$("loading");l.style.opacity=0;setTimeout(()=>l.remove(),700);}
}

/* boot */
applyLanguage();
placeAt(0);
renderHUD();
frame();
window.__journey={renderer,composer,sky:()=>skyInfo,modelInfo,placed,camBase,lookGoal,lookCur,scene,THREE,go,mainAction,setSub,tick:(sec)=>{for(let t=0;t<sec;t+=.04) step(.04,false);step(.04,true);},state:()=>({auto,capDur,current,sub,done,busy,replayed,beat,waiting,stepping,gates:gates.length,clock,cam:camBase.toArray(),hero:hero.position.toArray()})};
</script>
</body>
</html>
