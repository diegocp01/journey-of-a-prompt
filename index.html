<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Journey of a Prompt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Crect x='12' y='20' width='40' height='26' rx='5' fill='%23fff'/%3E%3Cpath d='M13 22l19 14 19-14' fill='none' stroke='%232f6fed' stroke-width='4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="gl" tabindex="-1"></canvas>
<div class="vignette"></div>
<div class="shade"></div>
<div class="shade-b"></div>

<div class="top">
  <div class="timer"><span id="timerValue">0.00</span><i>/ 20 s</i><small id="timerLabel"></small></div>
</div>

<div class="caption" id="caption" aria-live="polite"></div>

<!-- shown only during the ride inside the cable: how thin one glass thread is -->
<div class="size-legend" id="sizeLegend">
  <div><i class="hair"></i><span id="lgHair"></span></div>
  <div><i class="glass"></i><span id="lgGlass"></span></div>
</div>

<div class="bottom">
  <div class="legend">
    <div class="brand" id="brand"></div>
    <div class="chapter" id="chapter"></div>
    <nav class="dots" id="dots"></nav>
  </div>
  <div class="actions">
    <button class="back-btn" id="backBtn" type="button">‹</button>
    <button class="main-btn" id="mainBtn" type="button"></button>
  </div>
</div>

<div id="fade"></div>
<div id="loading">Loading the 3D world…<br>(needs an internet connection the first time)</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
